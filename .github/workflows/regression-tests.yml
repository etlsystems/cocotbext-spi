name: Regression Tests

# Run this workflow every time a new commit pushed to an open PR, or manually
on:
  # Includes edited because base-branch changes can require rerunning CI.
  # Comment edits alone usually do not matter, but this keeps behavior simple and safe.
  pull_request:
    types: [opened, reopened, edited, synchronize]

  # Run on version tags for backward-compatible publish flow
  push:
    tags:
      - 'v*'

  # CI can be manually started on any branch
  workflow_dispatch:

# This sets up a concurrency group for the branch associated with the workflow.
# If a new workflow is triggered, any running workflow with the same concurrency group will be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Secrets should be scoped to the job/step that needs them (avoid exporting secrets globally on PR runs).

jobs:
  build:
    name: Python ${{matrix.python-version}}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v4
      with:
        python-version: ${{matrix.python-version}}

    - name: Install Icarus Verilog
      run: |
        sudo apt install -y --no-install-recommends iverilog
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Test with tox
      run: tox

  publish_pypi:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [build]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        with:
          python-version: '3.10'
        uses: actions/setup-python@v4
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish
      - name: Create Release on Github
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          files: ./dist/*
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
